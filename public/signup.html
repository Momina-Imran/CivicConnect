<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - CivicConnect</title>
  <link rel="stylesheet" href="styleMain.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <!-- ========== NAVBAR / RIBBON ========== -->
  <div id="navbar">
    <div id="logo-area">
      <h2 id="logo">
        <img src="logo.svg" alt="CivicConnect Logo" width="160">
      </h2>
    </div>

    <nav>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="MyRequest.html">My Requests</a></li>
        <li><a href="complain.html">Make a Request</a></li>
       
      </ul>
      <ul id="auth-links">
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html" class="active">Sign Up</a></li>
      </ul>
    </nav>
  </div>
  <!-- ===================================== -->

  <div class="container">
    <div class="form-box">
      <h2>Create Account</h2>

      <!-- USER TYPE SWITCH -->
      <div class="role-box">
        <label class="role-option">
          <input type="radio" name="role" value="Citizen" checked>
          <span>Citizen</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="NGO">
          <span>NGO</span>
        </label>
      </div>

      <!-- CITIZEN SIGNUP FORM -->
      <form id="citizen-form" class="role-form active" action="#" method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="password">Password:</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="Create a password" required>
          <button type="button" id="show-password">Show</button>
        </div>

        <button type="submit" class="btn">Sign Up</button>

        <p class="text">Already have an account? <a href="login.html">Login</a></p>
      </form>

      <!-- NGO SIGNUP FORM -->
      <form id="ngo-form" class="role-form" action="#" method="post">
        <label for="org-name">Organization Name:</label>
        <input type="text" id="org-name" name="org-name" placeholder="Enter your organization name" required>

        <label for="org-email">Organization Email:</label>
        <input type="email" id="org-email" name="org-email" placeholder="Enter your organization email" required>

       
<label for="NGO-Sector">NGO Sector:</label>
<select id="NGO-Sector" name="NGO-Sector" required>
  <option value="">Select NGO Sector</option>
  <option value="waste">Waste Management</option>
  <option value="disaster management">Disaster Management</option>
  <option value="water">Water Supply & Sanitation</option>
  <option value="health">Health Services</option>
  <option value="women">Women Rights and Protection</option>
  <option value="education">Education</option>
  <option value="child">Child Labour / Child Protection</option>
  <option value="orphans">Orphan Care</option>
  <option value="disabled">Disabled Support</option>
  <option value="other">Other</option>
</select>


        <label for="org-phone">Contact Number:</label>
        <input type="tel" id="org-phone" name="org-phone" placeholder="Enter your contact number" required>

        <label for="org-address">Address:</label>
        <textarea id="org-address" name="org-address" placeholder="Enter your organization address" required></textarea>

        <label for="ngo-password">Password:</label>
        <div class="password-field">
          <input type="password" id="ngo-password" name="ngo-password" placeholder="Enter your password" required>
          <button type="button" id="show-ngo-password">Show</button>
        </div>

        <button type="submit" class="btn">Sign Up</button>

        <p class="text">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </div>

  <!-- include API helper -->
  <script src="api.js"></script>
<script>
  const citizenForm = document.getElementById("citizen-form");
  const ngoForm = document.getElementById("ngo-form");
  const roleRadios = document.querySelectorAll('input[name="role"]');

  // Toggle between forms based on role selection
  roleRadios.forEach(radio => {
    radio.addEventListener("change", (e) => {
      if (e.target.value === "Citizen") {
        citizenForm.classList.add("active");
        ngoForm.classList.remove("active");
      } else if (e.target.value === "NGO") {
        ngoForm.classList.add("active");
        citizenForm.classList.remove("active");
      }
    });
  });

  // Citizen password toggle
  const togglePassword = document.getElementById("show-password");
  const password = document.getElementById("password");

  togglePassword.addEventListener("click", () => {
    const type = password.getAttribute("type") === "password" ? "text" : "password";
    password.setAttribute("type", type);
    togglePassword.textContent = type === "password" ? "Show" : "Hide";
  });

  // NGO password toggle
  const toggleNGOPassword = document.getElementById("show-ngo-password");
  const ngoPassword = document.getElementById("ngo-password");

  toggleNGOPassword.addEventListener("click", () => {
    const type = ngoPassword.getAttribute("type") === "password" ? "text" : "password";
    ngoPassword.setAttribute("type", type);
    toggleNGOPassword.textContent = type === "password" ? "Show" : "Hide";
  });

  // Citizen form submission
  citizenForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    
    const userData = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    };

    try {
      const response = await fetch('/api/users/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(userData)
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("role", "Citizen");
        localStorage.setItem("user", JSON.stringify(data.user));
        alert("Registration successful!");
        window.location.href = "index.html";
      } else {
        alert(data.error || "Registration failed");
      }
    } catch (error) {
      console.error("Error:", error);
      alert("Network error. Please try again.");
    }
  });

  // NGO form submission - FIXED VERSION
  ngoForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    
    // Map form field names to backend expected names
    const ngoData = {
      orgName: document.getElementById("org-name").value,  // Map org-name to orgName
      email: document.getElementById("org-email").value,    // Map org-email to email
      password: document.getElementById("ngo-password").value,
      sector: document.getElementById("NGO-Sector").value,  // Map NGO-Sector to sector
      phone: document.getElementById("org-phone").value,
      address: document.getElementById("org-address").value
    };

    try {
      const response = await fetch('/api/ngo/register', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(ngoData)
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("role", "NGO");
        localStorage.setItem("ngo", JSON.stringify(data.ngo));
        alert("NGO Registration successful!");
        window.location.href = "ngo_dashboard.html";
      } else {
        alert(data.error || "Registration failed");
      }
    } catch (error) {
      console.error("Error:", error);
      alert("Network error. Please try again.");
    }
  });
</script>
</body>
</html>
